# ~/.tmux.conf — config mínima e sensata

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g status-position top

# recarregar config com prefix + r
bind r source-file ~/.tmux.conf \; display "Config recarregada"

# splits mais intuitivos, mantendo o diretório atual
# (letras simples — em ABNT2 o "|" costuma exigir AltGr e não é confiável em todo terminal)
bind v split-window -h -c "#{pane_current_path}"   # lado a lado
bind s split-window -v -c "#{pane_current_path}"   # empilhado
