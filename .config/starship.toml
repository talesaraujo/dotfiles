# ~/.config/starship.toml

# Inserts a blank line between shell prompts
add_newline = false

# Change command timeout from 500 to 1000 ms
command_timeout = 1000

[character]
# O ícone antigo "" foi substituído por uma seta padrão
success_symbol = "[➜](240)"
error_symbol = "[✗](240)"

[username]
style_user = "green bold"
style_root = "black bold"
format = "[$user]($style) "
disabled = false
show_always = true

[directory]
truncation_length = 3
truncation_symbol = "…/"
# CORREÇÃO: O ícone '' era o culpado pelo erro principal. Substituído pela casinha padrão.
home_symbol = " ~"
read_only_style = "197"
read_only = "  "
format = "at [$path]($style)[$read_only]($read_only_style) "

[git_branch]
# CORREÇÃO: Ícone de branch atualizado
symbol = " "
format = "on [$symbol$branch]($style) "
truncation_length = 30
truncation_symbol = "…/"
style = "bold red"

[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
# CORREÇÃO: Ícone de stash atualizado (o antigo quebrava)
stashed = " "
modified = " "
staged = '[++\($count\)](green)'
# CORREÇÃO: Ícone renamed atualizado (o antigo mostrava um caractere chinês)
renamed = " "
deleted = " "

[terraform]
format = "via [ terraform $version]($style) 壟 [$workspace]($style) "

[vagrant]
format = "via [ vagrant $version]($style) "
disabled = true

[docker_context]
format = "via [ $context](bold blue) "

[helm]
format = "via [ $version](bold purple) "

[python]
# CORREÇÃO: Ícone Python atualizado
symbol = " "
python_binary = "python3"
style="078"

[nodejs]
# CORREÇÃO: Ícone Node atualizado
format = "via [ $version](bold green) "
disabled = false

[ruby]
# CORREÇÃO: Ícone Ruby atualizado
format = "via [ $version]($style) "

[kubernetes]
format = 'on [ $context\($namespace\)](bold purple) '
disabled = true
[kubernetes.context_aliases]
"clcreative-k8s-staging" = "cl-k8s-staging"
"clcreative-k8s-production" = "cl-k8s-prod"

[container]
disabled = false
format = '[$symbol \[arch\]]($style) '
style = 'bold purple'

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue)on [$hostname](bold #E09D79) '
trim_at = '.companyname.com'
disabled = false

[package]
symbol = "󰏗 " 
style = "244"




